<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLITZ CYBER THREATS & IOC INVESTIGATION LAB</title>
  <meta name="description" content="Enterprise Cybersecurity Training Platform: Interactive Penetration Testing, SOC SIEM Telemetry, and IOC Investigation Range." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Courier New', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Chart.js CDN for SOC Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body class="bg-[#090d16] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-cyan-500/30 selection:text-cyan-300">

  <!-- Top Global Navbar -->
  <header class="bg-[#0c1220] border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Platform Brand & Title -->
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-600 to-blue-700 flex items-center justify-center text-white font-bold font-mono text-lg shadow-lg shadow-cyan-900/40">
            ⚡
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">
                BLITZ LAB RANGE
              </span>
              <span class="text-xs text-slate-400 font-mono hidden sm:inline">Threats &amp; IoC Investigation</span>
            </div>
            <h1 class="text-xs sm:text-sm font-bold text-white tracking-tight uppercase font-mono">
              BLITZ CYBER THREATS &amp; IOC INVESTIGATION LAB
            </h1>
          </div>
        </div>

        <!-- Connection & Progress Badges -->
        <div class="flex items-center gap-3">
          <div class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs font-mono">
            <span class="text-slate-400 text-[10px] uppercase">My IP:</span>
            <span id="nav-client-ip" class="text-cyan-300 font-bold">Detecting...</span>
          </div>

          <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs font-mono">
            <span class="text-slate-400 text-[10px] uppercase">Lab:</span>
            <span id="nav-progress-pct" class="text-emerald-400 font-bold">0%</span>
          </div>
        </div>
      </div>

      <!-- Navigation Bar (7 Required Sections) -->
      <nav class="flex items-center gap-1.5 py-2 border-t border-slate-800/60 overflow-x-auto">
        <button class="nav-link px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-md transition-all flex items-center gap-1.5 shrink-0" data-view="overview">
          <span>🏠 Overview</span>
        </button>
        <button class="nav-link px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all flex items-center gap-1.5 shrink-0" data-view="attack-lab">
          <span>⚔️ Attack Lab</span>
        </button>
        <button class="nav-link px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all flex items-center gap-1.5 shrink-0" data-view="soc-dashboard">
          <span>🛡️ SOC Dashboard</span>
        </button>
        <button class="nav-link px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all flex items-center gap-1.5 shrink-0" data-view="event-explorer">
          <span>🔎 Event Explorer</span>
        </button>
        <button class="nav-link px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all flex items-center gap-1.5 shrink-0" data-view="ioc-investigation">
          <span>🎯 IOC Investigation</span>
        </button>
        <button class="nav-link px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all flex items-center gap-1.5 shrink-0" data-view="challenge-progress">
          <span>🚩 Challenge Progress</span>
        </button>
        <button class="nav-link px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all flex items-center gap-1.5 shrink-0" data-view="student-instructions">
          <span>📖 Student Instructions</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Viewport Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="app-main-content">
      <!-- Dynamically rendered via app.js views -->
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="bg-[#0c1220] border-t border-slate-800/80 py-4 text-xs text-slate-500 font-mono">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div>BLITZ Cyber Threats &amp; IOC Investigation Lab • Production Defensive Range</div>
      <div class="flex items-center gap-3">
        <span>Host: blitzcorp.internal</span>
        <span>•</span>
        <span class="text-cyan-400">Isolated Student Session Engine Active</span>
      </div>
    </div>
  </footer>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Main Application Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
